<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vivi's Zyklus Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:           #f8f7f5;
      --surface:      #ffffff;
      --surface2:     #f0eeec;
      --border:       rgba(0,0,0,0.09);
      --rose:         #f43f5e;
      --rose-light:   #e11d48;
      --rose-dim:     rgba(244,63,94,0.1);
      --lavender:     #7c3aed;
      --lavender-dim: rgba(124,58,237,0.1);
      --teal:         #0d9488;
      --teal-dim:     rgba(13,148,136,0.1);
      --text:         #1c1917;
      --text-muted:   #57534e;
      --text-dim:     #a8a29e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.25rem 4rem;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(130deg, var(--rose-light) 0%, var(--lavender) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .fetched-at {
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .grid {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
    }

    .section-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 1.25rem;
    }

    /* ── Stat cards ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .stat-card {
      border-radius: 18px;
      padding: 1.4rem 1.5rem;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .stat-rose     { background: linear-gradient(135deg, var(--surface) 60%, rgba(244,63,94,0.15)); }
    .stat-lavender { background: linear-gradient(135deg, var(--surface) 60%, rgba(167,139,250,0.15)); }
    .stat-teal     { background: linear-gradient(135deg, var(--surface) 60%, rgba(45,212,191,0.15)); }

    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .stat-rose     .stat-value { color: var(--rose-light); }
    .stat-lavender .stat-value { color: var(--lavender); }
    .stat-teal     .stat-value { color: var(--teal); }

    .stat-sub {
      margin-top: 0.45rem;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    /* ── Assessment card ── */
    .assessment-card {
      border-radius: 18px;
      padding: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--lavender);
    }

    .assessment-card.follicular { border-left-color: var(--teal); }
    .assessment-card.unconfirmed,
    .assessment-card.unknown    { border-left-color: var(--text-dim); }
    .assessment-card.fertile    { border-left-color: #f59e0b; }
    .assessment-card.luteal     { border-left-color: #60a5fa; }

    .assessment-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .assessment-phase-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 0.3rem;
    }

    .assessment-phase-name {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--lavender);
    }

    .assessment-phase-name.follicular { color: var(--teal); }
    .assessment-phase-name.unconfirmed,
    .assessment-phase-name.unknown    { color: var(--text-muted); }
    .assessment-phase-name.fertile    { color: #92400e; }
    .assessment-phase-name.luteal     { color: #1d4ed8; }

    .assessment-date {
      font-size: 0.78rem;
      color: var(--text-dim);
      text-align: right;
    }

    .assessment-meta {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding: 0.9rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .assessment-meta-item { display: flex; flex-direction: column; gap: 3px; }

    .assessment-meta-lbl {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .assessment-meta-val {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
    }

    .assessment-body {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .assessment-body strong { color: var(--text); }

    .assessment-note {
      margin-top: 0.75rem;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      font-size: 0.79rem;
      line-height: 1.6;
    }

    .assessment-note.temp { background: rgba(124,58,237,0.07);  color: #5b21b6; border: 1px solid rgba(124,58,237,0.18); }
    .assessment-note.info { background: rgba(13,148,136,0.07);  color: #0f766e; border: 1px solid rgba(13,148,136,0.18); }
    .assessment-note.warn { background: rgba(245,158,11,0.09);  color: #b45309; border: 1px solid rgba(245,158,11,0.22); }

    /* ── Calendar ── */
    .cal-grid { display: flex; flex-direction: column; gap: 5px; }

    .cal-row { display: flex; align-items: center; gap: 8px; }

    .cal-label {
      font-size: 0.7rem;
      color: var(--text-dim);
      width: 46px;
      text-align: right;
      flex-shrink: 0;
      letter-spacing: 0.03em;
    }

    .cal-days { display: flex; gap: 2.5px; flex-wrap: nowrap; }

    .cal-num {
      width: 15px;
      font-size: 0.52rem;
      color: var(--text-dim);
      text-align: center;
      flex-shrink: 0;
    }

    .cal-day {
      width: 15px;
      height: 15px;
      border-radius: 3px;
      background: var(--surface2);
      flex-shrink: 0;
      cursor: default;
      transition: transform 0.1s ease;
    }

    .cal-day:hover          { transform: scale(1.4); z-index: 1; position: relative; }
    .cal-day.empty          { background: transparent; cursor: default; }
    .cal-day.future         { background: rgba(0,0,0,0.03); }
    .cal-day.period         { background: #7c3aed; }
    .cal-day.risk-red       { background: #ef4444; }
    .cal-day.risk-orange    { background: #f97316; }
    .cal-day.risk-green     { background: #86efac; }
    .cal-day.today          { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px #57534e !important; }

    .legend {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .legend-dot { width: 11px; height: 11px; border-radius: 2px; }

    /* ── Two-column ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    /* ── Chart ── */
    .chart-wrapper { position: relative; height: 200px; }

    /* ── Cycle list ── */
    .cycle-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 232px;
      overflow-y: auto;
    }

    .cycle-list::-webkit-scrollbar { width: 4px; }
    .cycle-list::-webkit-scrollbar-track { background: transparent; }
    .cycle-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .cycle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.9rem;
      background: var(--surface2);
      border-radius: 10px;
      border-left: 2.5px solid var(--rose);
    }

    .cycle-item.is-outlier { border-left-color: #f59e0b; }

    .cycle-item-date { font-size: 0.83rem; font-weight: 600; }
    .cycle-item-sub  { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }

    .badge {
      font-size: 0.72rem;
      padding: 2px 9px;
      border-radius: 99px;
      background: var(--rose-dim);
      color: var(--rose-light);
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.active   { background: var(--teal-dim); color: var(--teal); }
    .badge.outlier  { background: rgba(245,158,11,0.12); color: #fbbf24; }

    /* ── States ── */
    .loading { max-width: 1100px; margin: 4rem auto; text-align: center; color: var(--text-dim); }

    .error-box { max-width: 1100px; margin: 2rem auto; }
    .error-box h1 { margin-bottom: 1.5rem; }

    .error-msg {
      background: rgba(244,63,94,0.08);
      border: 1px solid rgba(244,63,94,0.25);
      border-radius: 14px;
      padding: 1.5rem 2rem;
      color: var(--rose-light);
      line-height: 1.6;
    }

    .error-msg code {
      background: rgba(244,63,94,0.15);
      padding: 0.1em 0.45em;
      border-radius: 4px;
      font-size: 0.9em;
    }

    /* ── Phase bar ── */
    .phase-bar-wrap {
      position: relative;
      padding-bottom: 1.6rem;
      margin-bottom: 0.25rem;
    }

    .phase-bar { display: flex; height: 22px; gap: 3px; }

    .phase-seg {
      border-radius: 5px;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .phase-seg:hover { opacity: 0.75; cursor: default; }

    .phase-seg.uncertain {
      background-image: repeating-linear-gradient(
        135deg, transparent 0, transparent 5px, rgba(0,0,0,0.22) 5px, rgba(0,0,0,0.22) 10px
      ) !important;
    }

    .phase-pin {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .phase-pin-line  { width: 2px; height: 22px; background: var(--text); opacity: 0.85; border-radius: 1px; }
    .phase-pin-label { font-size: 0.67rem; color: var(--text-muted); margin-top: 4px; white-space: nowrap; }

    .phase-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 0.9rem;
    }

    .phase-legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--text-muted); }
    .phase-legend-dot  { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    .phase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.3rem 0.9rem;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .phase-badge.menstrual  { background: var(--lavender-dim);        color: var(--lavender); }
    .phase-badge.follicular { background: var(--teal-dim);            color: var(--teal); }
    .phase-badge.unconfirmed { background: rgba(0,0,0,0.05);          color: var(--text-muted); }
    .phase-badge.fertile    { background: rgba(245,158,11,0.15);      color: #92400e; }
    .phase-badge.luteal     { background: rgba(59,130,246,0.12);      color: #1d4ed8; }
    .phase-badge.unknown    { background: rgba(0,0,0,0.05);           color: var(--text-dim); }

    /* ── Uncertainty notice ── */
    .uncertainty-notice {
      background: rgba(245,158,11,0.07);
      border: 1px solid rgba(245,158,11,0.22);
      border-radius: 18px;
      padding: 1.4rem 1.5rem;
    }

    .un-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .un-body {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.65;
    }

    .un-body strong { color: #fbbf24; }

    .un-confidence {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .un-conf-label { font-size: 0.72rem; color: var(--text-dim); }
    .conf-dots     { display: flex; gap: 5px; }

    .conf-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1.5px solid rgba(245,158,11,0.35);
      background: transparent;
    }

    .conf-dot.filled { background: #f59e0b; border-color: #f59e0b; }

    /* ── Fertility card ── */
    .fertility-card {
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 1.25rem;
      border: 1.5px solid;
    }

    .fertility-green   { background: #f0fdf4; border-color: #bbf7d0; color: #14532d; }
    .fertility-orange  { background: #fffbeb; border-color: #fde68a; color: #78350f; }
    .fertility-red     { background: #fff1f2; border-color: #fecdd3; color: #881337; }
    .fertility-unknown { background: var(--surface); border-color: var(--border); color: var(--text-muted); }

    .fc-icon {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1;
      flex-shrink: 0;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fertility-green .fc-icon  { background: #dcfce7; }
    .fertility-orange .fc-icon { background: #fef3c7; }
    .fertility-red .fc-icon    { background: #ffe4e6; }
    .fertility-unknown .fc-icon { background: var(--surface2); }

    .fc-headline { font-size: 1rem; font-weight: 700; margin-bottom: 0.3rem; }
    .fc-detail   { font-size: 0.84rem; line-height: 1.55; margin-bottom: 0.3rem; opacity: 0.9; }
    .fc-prob     { font-size: 0.79rem; opacity: 0.75; }
    .fc-prob strong { font-weight: 700; opacity: 1; }
    .fc-uncertainty {
      margin-top: 0.6rem;
      font-size: 0.74rem;
      opacity: 0.65;
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      background: rgba(0,0,0,0.06);
    }

    .stale-warning {
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 10px;
      padding: 0.55rem 1rem;
      font-size: 0.78rem;
      color: #92400e;
      margin-bottom: 1rem;
    }

    /* ── Phase Gantt ── */
    .phase-gantt { margin-top: 0.5rem; }
    .phase-gantt-row { display: flex; align-items: center; margin-bottom: 5px; }
    .phase-gantt-label { width: 120px; font-size: 0.7rem; color: var(--text-muted); flex-shrink: 0; text-align: right; padding-right: 10px; line-height: 1.3; }
    .phase-gantt-track { flex: 1; height: 16px; background: var(--surface2); border-radius: 4px; position: relative; }
    .phase-gantt-bar { position: absolute; top: 0; height: 100%; border-radius: 4px; transition: opacity 0.15s; }
    .phase-gantt-bar:hover { opacity: 0.75 !important; cursor: default; }
    .phase-gantt-bar.uncertain {
      background-image: repeating-linear-gradient(
        135deg, transparent 0, transparent 5px, rgba(0,0,0,0.22) 5px, rgba(0,0,0,0.22) 10px
      ) !important;
    }

    /* ── Temperature explainer ── */
    .temp-explainer { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.55rem; }
    .temp-explainer-row { display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.78rem; color: var(--text-muted); line-height: 1.55; }
    .temp-phase-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .stats-row { grid-template-columns: 1fr; }
      .two-col   { grid-template-columns: 1fr; }
      .cal-day   { width: 12px; height: 12px; }
      .cal-label { width: 36px; font-size: 0.65rem; }
      .assessment-meta { gap: 1rem; }
    }
  </style>
</head>

<div id="app">
  <div class="loading">Lade Daten…</div>
</div>

<script>
const MONTHS_DE = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

// ── Utilities ─────────────────────────────────────────────────────────────────
// Day strings are handled as UTC midnight so DST switches can never shift a day.

function parseDay(ds) {
  return new Date(ds + 'T00:00:00Z');
}

function addDays(ds, n) {
  const d = parseDay(ds);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

function daysBetween(a, b) {
  return Math.round((parseDay(b) - parseDay(a)) / 86_400_000);
}

function fmtDate(ds) {
  if (!ds) return '–';
  const d = parseDay(ds);
  return `${d.getUTCDate()}. ${MONTHS_DE[d.getUTCMonth()]}`;
}

function fmtDateFull(ds) {
  if (!ds) return '–';
  const d = parseDay(ds);
  return `${d.getUTCDate()}. ${MONTHS_DE[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}

function fmtTemp(v) {
  return `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(2).replace('.', ',')} °C`;
}

// Local calendar date: between 0 and 2 am the UTC date would still be yesterday.
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function median(arr) {
  const s = [...arr].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
}

// ── Period merging ────────────────────────────────────────────────────────────
// Oura logs each period day as a separate enhanced_tag entry.
// Merge entries that are ≤1 day apart into a single period span.

function mergePeriods(rawPeriods) {
  const sorted = [...rawPeriods].sort((a, b) => a.start_day.localeCompare(b.start_day));
  const merged = [];
  for (const p of sorted) {
    const pEnd = p.end_day ?? p.start_day;
    const last = merged.at(-1);
    if (last && daysBetween(last.end, p.start_day) <= 1) {
      if (pEnd > last.end) last.end = pEnd;
    } else {
      merged.push({ start: p.start_day, end: pEnd });
    }
  }
  return merged;
}

// ── Cycle analysis ────────────────────────────────────────────────────────────

function analyzeCycles(raw, today) {
  const periods = mergePeriods(raw.periods ?? []);

  const periodSet = new Set();
  for (const p of periods) {
    let cur = p.start;
    while (cur <= p.end) {
      periodSet.add(cur);
      cur = addDays(cur, 1);
    }
  }

  const cycles = periods.map((p, i) => {
    const next     = periods[i + 1] ?? null;
    const length   = next ? daysBetween(p.start, next.start) : null;
    const duration = daysBetween(p.start, p.end) + 1;
    // Cycles >45 days flagged as outliers (fasting, post-pill suppression, etc.)
    const isOutlier = length != null && length > 45;
    return { start: p.start, end: p.end, length, duration, isOutlier };
  });

  const validCycles  = cycles.filter(c => c.length != null && !c.isOutlier && c.length >= 18);
  const validLengths = validCycles.map(c => c.length);

  const avgLength = validLengths.length
    ? Math.round(validLengths.reduce((a, b) => a + b, 0) / validLengths.length)
    : null;
  const shortest = validLengths.length ? Math.min(...validLengths) : null;
  const longest  = validLengths.length ? Math.max(...validLengths) : null;

  const lastStart  = periods.map(p => p.start).filter(d => d <= today).at(-1) ?? null;
  const currentDay = lastStart ? daysBetween(lastStart, today) + 1 : null;

  let nextPeriod = null;
  if (lastStart && avgLength) {
    const est = addDays(lastStart, avgLength);
    if (est > today) nextPeriod = est;
  }

  const currentPeriodDuration = lastStart
    ? ([...periodSet].filter(d => d >= lastStart && d <= today).length || null)
    : null;

  return {
    periodSet, cycles, validCycles, avgLength, shortest, longest,
    currentDay, nextPeriod, lastStart, currentPeriodDuration,
  };
}

// ── Ovulation detection: 3-over-6 rule (symptothermal method / Sensiplan) ────
// A shift counts as confirmed when 3 consecutive readings lie above the
// coverline (highest of the 6 readings before them) and the 3rd is at least
// 0.2 °C above it, otherwise a 4th higher reading is required.
// Ring data is noisy, so one outlier among the 6 low readings is tolerated
// (coverline = 2nd-highest). Ovulation ≈ last low day before the first high.

const FEVER_LIMIT = 0.75;

function cycleReadings(tempMap, start, end) {
  const readings = [];
  const n = daysBetween(start, end) + 1;
  for (let i = 0; i < n; i++) {
    const day = addDays(start, i);
    const v   = tempMap.get(day);
    if (v != null && v <= FEVER_LIMIT) readings.push({ cd: i + 1, day, v });
  }
  return readings;
}

function coverlineOf(prev) {
  return prev.map(r => r.v).sort((a, b) => a - b)[prev.length - 2];
}

function detectShift(tempMap, start, end) {
  const readings = cycleReadings(tempMap, start, end);
  for (let i = 6; i < readings.length; i++) {
    const first = readings[i];
    const prev  = readings.slice(i - 6, i);
    // The 6 low readings must be recent enough to describe the pre-ovulatory level
    if (prev[0].cd < first.cd - 12) continue;
    const coverline = coverlineOf(prev);
    const next = readings.slice(i, i + 4);
    if (next.length < 3 || next[2].cd - first.cd > 4) continue;
    if (!next.slice(0, 3).every(r => r.v > coverline)) continue;

    let confirm = null;
    if (next[2].v >= coverline + 0.2) confirm = next[2];
    else if (next[3] && next[3].v > coverline && next[3].cd - first.cd <= 5) confirm = next[3];
    if (!confirm) continue;

    return {
      ovDay:         first.cd - 1,
      ovDate:        addDays(first.day, -1),
      firstHighDate: first.day,
      confirmDay:    confirm.cd,
      confirmDate:   confirm.day,
      coverline,
      coverFrom:     prev[0].day,
    };
  }
  return null;
}

// Status of the running cycle when no shift is confirmed yet:
// how many of the latest readings already sit above the coverline.
function currentTempStatus(tempMap, start, today) {
  if (!start) return null;
  const readings = cycleReadings(tempMap, start, today);
  const latest = readings.at(-1) ?? null;
  if (!latest) return null;

  let highCount = 0;
  let firstHighDay = null;
  let coverline = readings.length >= 7 ? coverlineOf(readings.slice(-7, -1)) : null;
  for (let k = 1; k <= 3 && readings.length >= k + 6; k++) {
    const tail  = readings.slice(-k);
    const cover = coverlineOf(readings.slice(-k - 6, -k));
    if (tail.every(r => r.v > cover)) { highCount = k; coverline = cover; firstHighDay = tail[0].day; }
    else break;
  }
  return { latest, coverline, highCount, firstHighDay };
}

// ── Fertility model for the current cycle ─────────────────────────────────────
// Window: calendar rule (Knaus-Ogino) from the shortest / longest valid cycle,
// first fertile day = shortest − 18, last fertile day = longest − 11.
// Core (red): ovulation days observed in past cycles, OV−2 to OV+1 (Wilcox 1995).
// Post-pill, both are widened by a buffer that shrinks with more valid cycles.
// A confirmed temperature shift ends the window after the confirmation day.

function fertilityModel(cycleInfos, analysis) {
  const { shortest, longest, avgLength } = analysis;
  const nValid = analysis.validCycles.length;
  const buf    = nValid < 3 ? 2 : nValid < 6 ? 1 : 0;

  const pastOv = cycleInfos
    .filter(c => c.length && !c.isOutlier && c.shift)
    .map(c => c.shift.ovDay);
  const fallbackOv = avgLength ? avgLength - 14 : 14;
  const ovMin = pastOv.length ? Math.min(...pastOv) : fallbackOv;
  const ovMax = pastOv.length ? Math.max(...pastOv) : fallbackOv;
  const ovExpected = pastOv.length ? median(pastOv) : fallbackOv;

  const redStart = Math.max(1, ovMin - 2 - buf);
  const redEnd   = ovMax + 1 + buf;
  const knausStart = shortest ? shortest - 18 - buf : redStart - 3;
  const knausEnd   = longest  ? longest  - 11 + buf : redEnd;
  const winStart = Math.max(1, Math.min(redStart, knausStart));
  const winEnd   = Math.max(redEnd, knausEnd);

  return { buf, nValid, pastOv, ovMin, ovMax, ovExpected, redStart, redEnd, winStart, winEnd, shortest, longest };
}

function riskForDay(cd, model, shift) {
  if (shift && cd > shift.confirmDay) return 'low-after';
  if (cd < model.winStart)            return 'low-before';
  if (cd >= model.redStart && cd <= model.redEnd) return 'red';
  if (cd <= model.winEnd)             return 'orange';
  return 'unconfirmed';
}

// ── Phase calculation ─────────────────────────────────────────────────────────

const PHASE_LABELS = {
  menstrual:   'Menstruation',
  follicular:  'Follikelphase',
  fertile:     'Fruchtbares Fenster',
  luteal:      'Lutealphase',
  unconfirmed: 'Eisprung unbestätigt',
  unknown:     '–',
};

const PHASE_COLORS = {
  menstrual:  '#7c3aed',
  follicular: '#0d9488',
  fertile:    '#f59e0b',
  luteal:     '#3b82f6',
};

function calculatePhases(currentDay, avgLength, model, shift, todayInPeriod) {
  const ovConfirmed  = !!shift;
  const ovulationDay = ovConfirmed ? shift.ovDay : model.ovExpected;
  const len = Math.max(avgLength ?? 28, currentDay ?? 0);

  let currentPhase = 'unknown';
  if (currentDay != null) {
    if (todayInPeriod)                              currentPhase = 'menstrual';
    else if (ovConfirmed && currentDay > ovulationDay) currentPhase = 'luteal';
    else if (currentDay < model.winStart)           currentPhase = 'follicular';
    else if (currentDay <= model.winEnd)            currentPhase = 'fertile';
    else                                            currentPhase = 'unconfirmed';
  }
  return { len, ovulationDay, ovConfirmed, currentPhase };
}

// ── Daily gynecological assessment card ───────────────────────────────────────

function buildDailyAssessment(ctx) {
  const { currentDay, avgLength, phases, model, shift, lastStart, tempStatus, nextPeriod, lastCompleted, latestTempDay, today } = ctx;
  const { currentPhase } = phases;
  const dateOf = cd => addDays(lastStart, cd - 1);

  const phaseDescriptions = {
    menstrual:
      'Du bist in der <strong>Menstruation</strong>. Östrogen und Progesteron sind auf ihrem Tiefpunkt, die Gebärmutterschleimhaut wird abgestoßen. Die Körpertemperatur liegt meist leicht unter deinem Durchschnitt.',
    follicular:
      'Du bist in der <strong>Follikelphase</strong>. FSH lässt Follikel heranreifen, der führende Follikel bildet zunehmend Östrogen. Die Temperatur bleibt in dieser Phase niedrig.',
    fertile:
      'Du bist im <strong>fruchtbaren Fenster</strong>. Steigendes Östrogen macht den Zervixschleim spermiendurchlässig, der LH-Anstieg löst den Eisprung aus. Wichtig: Der Temperaturanstieg zeigt den Eisprung erst im Nachhinein an, er warnt nicht vorher.',
    luteal:
      'Du bist in der <strong>Lutealphase</strong>. Der Gelbkörper bildet Progesteron, das die Temperatur um etwa 0,2 bis 0,5 °C anhebt. Ohne Schwangerschaft sinkt Progesteron nach 10 bis 16 Tagen ab, die Temperatur fällt und die Periode setzt ein.',
    unconfirmed:
      'Der <strong>Eisprung ist noch nicht bestätigt</strong>. Die erwarteten Tage sind vorbei, ein eindeutiger Temperaturanstieg fehlt aber noch. Nach dem Absetzen der Pille kommen späte Eisprünge und einzelne Zyklen ohne Eisprung häufiger vor.',
    unknown:
      'Phase noch nicht bestimmbar, es fehlen Trackingdaten.',
  };

  const notes = [];

  if (tempStatus) {
    const { latest, coverline, highCount } = tempStatus;
    const head = `Letzte Messung (${fmtDate(latest.day)}): <strong>${fmtTemp(latest.v)}</strong>.`;
    if (shift) {
      notes.push({ type: 'info', text: `${head} Temperaturanstieg seit ${fmtDate(shift.firstHighDate)}, nach der 3-über-6-Regel am ${fmtDate(shift.confirmDate)} bestätigt (Hilfslinie ${fmtTemp(shift.coverline)}).` });
    } else if (highCount > 0) {
      notes.push({ type: 'warn', text: `${head} ${highCount === 1 ? 'Erster Wert' : `${highCount} Werte in Folge`} über der Hilfslinie (${fmtTemp(coverline)}). Möglicher Beginn des Temperaturanstiegs, bestätigt ist er erst nach 3 erhöhten Werten.` });
    } else if (coverline != null) {
      notes.push({ type: 'temp', text: `${head} Nicht über der Hilfslinie (${fmtTemp(coverline)}), noch kein Temperaturanstieg.` });
    } else {
      notes.push({ type: 'temp', text: `${head} Für eine Hilfslinie fehlen in diesem Zyklus noch Messungen.` });
    }
  }

  if (latestTempDay && latestTempDay < today) {
    notes.push({ type: 'temp', text: `Der Temperaturwert für heute ist noch nicht im Dashboard (letzter Wert: ${fmtDate(latestTempDay)}). Er kommt nach dem Ring-Sync mit dem nächsten Abruf um 8 oder 12 Uhr.` });
  }

  if (lastCompleted?.luteal != null && lastCompleted.luteal < 10) {
    notes.push({ type: 'warn', text: `Im letzten Zyklus war die Lutealphase mit ${lastCompleted.luteal} Tagen kurz (Norm: 10 bis 16 Tage). Nach dem Absetzen der Pille ist das häufig und normalisiert sich meist innerhalb einiger Zyklen.` });
  }

  const ovVal = shift
    ? `${fmtDate(shift.ovDate)} (bestätigt)`
    : lastStart
    ? (model.ovMin === model.ovMax
        ? `ca. ${fmtDate(dateOf(model.ovMin))}`
        : `ca. ${fmtDate(dateOf(model.ovMin))} bis ${fmtDate(dateOf(model.ovMax))}`)
    : '–';

  const metaItems = [
    { lbl: 'Zyklustag',       val: currentDay != null ? `${currentDay} / ${avgLength ?? '–'}` : '–' },
    { lbl: 'Periode',         val: fmtDate(lastStart) },
    { lbl: 'Nächste Periode', val: nextPeriod ? `ca. ${fmtDate(nextPeriod)}` : '–' },
    { lbl: 'Eisprung',        val: ovVal },
  ];

  const metaHtml = metaItems.map(m => `
    <div class="assessment-meta-item">
      <div class="assessment-meta-lbl">${m.lbl}</div>
      <div class="assessment-meta-val">${m.val}</div>
    </div>`).join('');

  const notesHtml = notes.map(n =>
    `<div class="assessment-note ${n.type}">${n.text}</div>`
  ).join('');

  const dateLabel = parseDay(today).toLocaleDateString('de-DE', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC',
  });

  return `
    <div class="assessment-card ${currentPhase}">
      <div class="assessment-top">
        <div>
          <div class="assessment-phase-label">Gynäkologische Tagesauswertung</div>
          <div class="assessment-phase-name ${currentPhase}">${PHASE_LABELS[currentPhase]}</div>
        </div>
        <div class="assessment-date">${dateLabel}</div>
      </div>
      <div class="assessment-meta">${metaHtml}</div>
      <div class="assessment-body">
        ${phaseDescriptions[currentPhase] ?? ''}
        ${notesHtml}
      </div>
    </div>`;
}

// ── Fertility / contraception card ───────────────────────────────────────────
// Probabilities per day of intercourse relative to ovulation: Wilcox 1995 (NEJM),
// Dunson 2002 (Hum Reprod). Green only before the calendar-rule window or after
// a confirmed temperature shift.

function buildFertilityCard(risk, model, shift, lastStart, tempStatus, currentDay) {
  if (!lastStart || risk == null) {
    return `<div class="fertility-card fertility-unknown">
      <div class="fc-icon">?</div>
      <div>
        <div class="fc-headline">Verhütungsempfehlung</div>
        <div class="fc-detail">Noch nicht genug Daten für eine Einschätzung.</div>
      </div>
    </div>`;
  }

  const dateOf = cd => addDays(lastStart, cd - 1);
  const ovRange = model.ovMin === model.ovMax
    ? `um den ${fmtDate(dateOf(model.ovMin))} (Zyklustag ${model.ovMin})`
    : `zwischen ${fmtDate(dateOf(model.ovMin))} und ${fmtDate(dateOf(model.ovMax))} (Zyklustag ${model.ovMin} bis ${model.ovMax})`;
  const ovSource = model.pastOv.length
    ? `aus ${model.pastOv.length} bisherigen Temperaturkurven`
    : 'aus der Ø Zykluslänge geschätzt';
  const rising = tempStatus?.highCount > 0 && !shift
    ? ` Seit ${fmtDate(tempStatus.firstHighDay)} liegt die Temperatur über der Hilfslinie, das kann der Beginn des Anstiegs sein.`
    : '';

  let level, icon, headline, prob, detail;

  switch (risk) {
    case 'low-before':
      level = 'green'; icon = '✓';
      headline = 'Geringes Risiko heute';
      prob = 'gering';
      detail = `Das fruchtbare Fenster beginnt voraussichtlich am ${fmtDate(dateOf(model.winStart))} (Zyklustag ${model.winStart}). Grundlage: kürzester Zyklus (${model.shortest ?? '?'} Tage) minus 18${model.buf ? `, minus ${model.buf} Tag Puffer` : ''}.`;
      break;
    case 'orange': {
      level = 'orange'; icon = '!';
      const afterCore = currentDay > model.redEnd;
      headline = 'Erhöhtes Risiko: Verhütung empfohlen';
      prob = 'ca. 5 bis 15 %';
      detail = afterCore
        ? `Ende des fruchtbaren Fensters. Der Eisprung ist noch nicht durch einen Temperaturanstieg bestätigt, bis dahin weiter verhüten.${rising}`
        : `Fruchtbares Fenster. Spermien überleben bis zu 5 Tage, der Eisprung wird ${ovRange} erwartet (${ovSource}).${rising}`;
      break;
    }
    case 'red':
      level = 'red'; icon = '⚠';
      headline = 'Hohes Risiko: unbedingt verhüten';
      prob = 'bis ca. 30 %';
      detail = `Eisprung erwartet ${ovRange}, ${ovSource}. Höchste Fruchtbarkeit des Zyklus.${rising}`;
      break;
    case 'unconfirmed':
      level = 'orange'; icon = '!';
      headline = 'Eisprung noch nicht bestätigt: weiter verhüten';
      prob = 'unklar';
      detail = `Das erwartete Fenster ist vorbei, die Temperatur zeigt aber noch keinen eindeutigen Anstieg (3 über 6). Möglich sind ein späterer Eisprung oder ein Zyklus ohne Eisprung.${rising}`;
      break;
    case 'low-after':
      level = 'green'; icon = '✓';
      headline = 'Geringes Risiko heute';
      prob = 'unter 1 %';
      detail = `Eisprung bestätigt: Temperaturanstieg seit ${fmtDate(shift.firstHighDate)}, gesichert am ${fmtDate(shift.confirmDate)}. Eisprung ca. ${fmtDate(shift.ovDate)}. Bis zur nächsten Periode sehr geringes Risiko.`;
      break;
  }

  const bufNote = model.buf > 0
    ? `Sicherheitspuffer ±${model.buf} Tag${model.buf > 1 ? 'e' : ''} wegen post-Pille-Unsicherheit (${model.nValid} gültige Zyklen). `
    : '';

  return `<div class="fertility-card fertility-${level}">
    <div class="fc-icon">${icon}</div>
    <div>
      <div class="fc-headline">${headline}</div>
      <div class="fc-detail">${detail}</div>
      <div class="fc-prob">Schwangerschaftswahrscheinlichkeit heute: <strong>${prob}</strong></div>
      <div class="fc-uncertainty">${bufNote}Basis: Temperaturregel nach Sensiplan (3 über 6), Kalenderregel, Wilcox 1995 / Dunson 2002.</div>
    </div>
  </div>`;
}

// ── Phase bar card ────────────────────────────────────────────────────────────

function buildPhaseCard(phases, currentDay, actualPeriodLen) {
  const { len, ovulationDay, ovConfirmed, currentPhase } = phases;
  const barPeriodLen = actualPeriodLen ?? 5;

  // 3 biological phases only, fertile window is shown in the calendar.
  // Until the shift is confirmed, ovulation and luteal phase are projections (striped).
  const rows = [
    { key: 'menstrual',  start: 1,                end: barPeriodLen, uncertain: false },
    { key: 'follicular', start: 1,                end: ovulationDay, uncertain: !ovConfirmed },
    { key: 'luteal',     start: ovulationDay + 1, end: len,          uncertain: !ovConfirmed },
  ].filter(r => r.start <= r.end && r.end >= 1);

  const pL = s => ((s - 1) / len * 100).toFixed(2) + '%';
  const pW = (s, e) => ((e - s + 1) / len * 100).toFixed(2) + '%';

  const pinLeft = currentDay != null
    ? ((Math.min(currentDay, len) - 0.5) / len * 100).toFixed(2) + '%'
    : null;
  const todayPin = pinLeft
    ? `<div style="position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:0.75;border-radius:1px;left:${pinLeft};z-index:2;pointer-events:none"></div>`
    : '';

  const ovLeft = ((ovulationDay - 0.5) / len * 100).toFixed(2) + '%';
  const ovStyle = ovConfirmed
    ? 'background:#f59e0b'
    : 'background:repeating-linear-gradient(180deg,#f59e0b 0,#f59e0b 3px,transparent 3px,transparent 5px)';
  const ovPin = `<div style="position:absolute;top:0;bottom:0;width:2px;${ovStyle};opacity:0.9;border-radius:1px;left:${ovLeft};z-index:3;pointer-events:none"></div>`;

  let ticksHtml = '';
  let lastTick = 1;
  for (let d = 1; d <= len; d += 7) {
    ticksHtml += `<div style="position:absolute;left:${pL(d)};font-size:0.58rem;color:var(--text-dim);transform:translateX(-50%)">${d}</div>`;
    lastTick = d;
  }
  if (len - lastTick >= 3) {
    ticksHtml += `<div style="position:absolute;right:0;font-size:0.58rem;color:var(--text-dim);transform:translateX(50%)">${len}</div>`;
  }

  const rowsHtml = rows.map(r => `
    <div class="phase-gantt-row">
      <div class="phase-gantt-label">${PHASE_LABELS[r.key]}</div>
      <div class="phase-gantt-track">
        <div class="phase-gantt-bar${r.uncertain && r.key === 'luteal' ? ' uncertain' : ''}"
          style="left:${pL(r.start)};width:${pW(r.start,r.end)};background:${PHASE_COLORS[r.key]};${r.uncertain && r.key === 'luteal' ? 'opacity:0.45' : ''}"
          title="${PHASE_LABELS[r.key]}: Tag ${r.start} bis ${r.end}${r.uncertain ? ' (erwartet)' : ''}"></div>
        ${todayPin}
        ${ovPin}
      </div>
    </div>`).join('');

  const pinDayHtml = pinLeft
    ? `<div style="display:flex"><div style="width:120px;flex-shrink:0"></div><div style="flex:1;position:relative;height:1.2rem"><div style="position:absolute;left:${pinLeft};transform:translateX(-50%);font-size:0.67rem;color:var(--text-muted);white-space:nowrap">Tag ${currentDay}</div></div></div>`
    : '';

  const legendHtml = `
    <div class="phase-legend" style="margin-top:0.85rem">
      ${['menstrual', 'follicular', 'luteal'].map(k => `
      <div class="phase-legend-item">
        <div class="phase-legend-dot" style="background:${PHASE_COLORS[k]}"></div>
        ${PHASE_LABELS[k]}${k === 'luteal' && !ovConfirmed ? ' (erwartet)' : ''}
      </div>`).join('')}
      <div class="phase-legend-item">
        <div style="width:3px;height:12px;${ovStyle};border-radius:1px;flex-shrink:0"></div>
        Eisprung (${ovConfirmed ? 'bestätigt, Tag ' : 'erwartet ca. Tag '}${ovulationDay})
      </div>
      ${pinLeft ? `<div class="phase-legend-item">
        <div style="width:3px;height:12px;background:var(--text);opacity:0.75;border-radius:1px;flex-shrink:0"></div>
        Heute (Tag ${currentDay})
      </div>` : ''}
    </div>`;

  return `
    <div class="phase-header">
      <div class="section-title" style="margin-bottom:0">Zyklusphase</div>
      <div class="phase-badge ${currentPhase}">${PHASE_LABELS[currentPhase]}</div>
    </div>
    <div class="phase-gantt">
      <div style="display:flex;margin-bottom:6px"><div style="width:120px;flex-shrink:0"></div><div style="flex:1;position:relative;height:12px">${ticksHtml}</div></div>
      ${rowsHtml}
      ${pinDayHtml}
    </div>
    ${legendHtml}`;
}

// ── Uncertainty notice ────────────────────────────────────────────────────────

function buildUncertaintyNotice(validCount) {
  const maxDots  = 6;
  const filled   = Math.min(validCount, maxDots);
  const dotsHtml = Array.from({ length: maxDots }, (_, i) =>
    `<div class="conf-dot${i < filled ? ' filled' : ''}"></div>`
  ).join('');

  const statusText = filled === 0
    ? 'Noch kein gültiger Zyklus getrackt.'
    : filled < 6
    ? `${filled} gültige ${filled === 1 ? 'Zyklus' : 'Zyklen'} (ohne Ausreißer), ab 6 entfällt der Sicherheitspuffer.`
    : `${filled} gültige Zyklen, Vorhersage ohne Sicherheitspuffer.`;

  return `<div class="uncertainty-notice">
    <div class="un-header"><span>⚠</span> Fruchtbarkeitsvorhersage eingeschränkt</div>
    <div class="un-body">
      Nach dem Absetzen der Pille stellt sich der Zyklus neu ein, das kann mehrere Monate
      dauern. Die Temperatur des Rings bestätigt einen Eisprung nur im Nachhinein. Die
      angezeigten fruchtbaren Tage sind daher eine Schätzung und
      <strong>kein verlässlicher Verhütungsschutz</strong>.
    </div>
    <div class="un-confidence">
      <span class="un-conf-label">Konfidenz</span>
      <div class="conf-dots">${dotsHtml}</div>
      <span class="un-conf-label">${statusText}</span>
    </div>
  </div>`;
}

// ── Calendar ──────────────────────────────────────────────────────────────────

function buildCalendar(periodSet, redSet, orangeSet, today) {
  const year = Number(today.slice(0, 4));

  const months = [];
  for (let m = 2; m <= 11; m++) months.push({ year, month: m });

  let html = '<div class="cal-grid">';

  html += `<div class="cal-row"><div class="cal-label"></div><div class="cal-days">`;
  for (let n = 1; n <= 31; n++) html += `<div class="cal-num">${n}</div>`;
  html += `</div></div>`;

  for (const { year: y, month } of months) {
    const label       = MONTHS_DE[month];
    const daysInMonth = new Date(Date.UTC(y, month + 1, 0)).getUTCDate();

    html += `<div class="cal-row"><div class="cal-label">${label}</div><div class="cal-days">`;

    for (let d = 1; d <= daysInMonth; d++) {
      const ds       = `${y}-${String(month + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday  = ds === today;
      const isPeriod = periodSet.has(ds);
      const isFuture = ds > today;
      const isRed    = !isPeriod && redSet.has(ds);
      const isOrange = !isPeriod && !isRed && orangeSet.has(ds);

      let cls = 'cal-day';
      if (isPeriod)       cls += ' period';
      else if (isRed)     cls += ' risk-red';
      else if (isOrange)  cls += ' risk-orange';
      else if (isFuture)  cls += ' future';
      if (isToday) cls += ' today';

      let title = ds;
      if (isPeriod) title = `Periode: ${ds}`;
      if (isRed)    title = `Hohes Risiko: ${ds}`;
      if (isOrange) title = `Erhöhtes Risiko: ${ds}`;
      if (isToday)  title = `Heute: ${ds}`;

      html += `<div class="${cls}" title="${title}"></div>`;
    }

    for (let p = daysInMonth + 1; p <= 31; p++) html += `<div class="cal-day empty"></div>`;
    html += `</div></div>`;
  }

  html += `</div>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:#7c3aed"></div>
      Periode
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#ef4444"></div>
      Hohes Risiko (rund um den Eisprung)
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#f97316"></div>
      Erhöhtes Risiko (fruchtbares Fenster)
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--surface2);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px #57534e"></div>
      Heute
    </div>
  </div>`;

  return html;
}

// ── Cycle list ────────────────────────────────────────────────────────────────

function buildCycleList(cycleInfos, currentDay) {
  if (!cycleInfos.length)
    return '<p style="color:var(--text-dim);font-size:.83rem">Keine Zyklen gefunden.</p>';

  return [...cycleInfos].reverse().slice(0, 10).map(c => {
    const isActive  = !c.length;
    const isOutlier = c.isOutlier;
    const ovText = c.shift
      ? ` · Eisprung Tag ${c.shift.ovDay}${c.luteal != null ? ` · Lutealphase ${c.luteal} Tage` : ''}`
      : isActive ? ' · Eisprung noch nicht bestätigt' : ' · Eisprung nicht erkennbar';

    let badgeClass = 'badge';
    let badgeText  = '';
    let subText    = '';

    if (isActive) {
      badgeClass += ' active';
      badgeText   = 'aktiv';
      subText     = `Aktueller Zyklus, Tag ${currentDay ?? '?'}${ovText}`;
    } else if (isOutlier) {
      badgeClass += ' outlier';
      badgeText   = '⚠ Ausreißer';
      subText     = `${c.length} Tage, nicht im Ø (Fasten / post-Pille)${ovText}`;
    } else {
      badgeText = `${c.length}d`;
      subText   = `Länge: ${c.length} Tage${ovText}`;
    }

    return `
      <div class="cycle-item${isOutlier ? ' is-outlier' : ''}">
        <div>
          <div class="cycle-item-date">${fmtDateFull(c.start)}</div>
          <div class="cycle-item-sub">${subText}</div>
        </div>
        <div class="${badgeClass}">${badgeText}</div>
      </div>`;
  }).join('');
}

// ── Temperature chart ─────────────────────────────────────────────────────────

function buildTempChart(temperatureData, periodSet, cycleInfos) {
  if (!temperatureData?.length) {
    document.getElementById('tempChart').parentElement.innerHTML =
      `<p style="color:var(--text-dim);font-size:.83rem;text-align:center;padding-top:2.5rem;line-height:1.6">
        Noch keine Temperaturdaten vorhanden.<br>
        <span style="font-size:.75rem">Trage den Ring jede Nacht, nach einigen Wochen erscheint hier die Kurve.</span>
      </p>`;
    return;
  }

  const slice  = temperatureData.slice(-90);
  const labels = slice.map(d => fmtDate(d.day));
  const values = slice.map(d => d.temperature_deviation);
  const pointColors = slice.map(d => periodSet.has(d.day) ? '#7c3aed' : '#a78bfa');

  const idxOnOrAfter = ds => slice.findIndex(d => d.day >= ds);
  const idxOnOrBefore = ds => {
    for (let i = slice.length - 1; i >= 0; i--) if (slice[i].day <= ds) return i;
    return -1;
  };

  // One ovulation marker + coverline per cycle with a confirmed shift
  const shifts = cycleInfos
    .filter(c => c.shift)
    .map(c => ({
      firstHigh: idxOnOrAfter(c.shift.firstHighDate),
      coverFrom: idxOnOrAfter(c.shift.coverFrom),
      coverTo:   idxOnOrBefore(c.shift.confirmDate),
      coverline: c.shift.coverline,
    }))
    .filter(s => s.firstHigh > 0);

  const periodStartLines = [];
  for (let i = 0; i < slice.length; i++) {
    const isPeriodFirstDay = periodSet.has(slice[i].day) &&
      (i === 0 || !periodSet.has(slice[i - 1].day));
    if (isPeriodFirstDay) periodStartLines.push(i);
  }

  const annotationsPlugin = {
    id: 'annotations',
    beforeDatasetsDraw(chart) {
      const { ctx, chartArea, data, scales } = chart;
      const n = data.labels.length;
      if (!n || !chartArea) return;
      const x = i => scales.x.getPixelForValue(i);
      ctx.save();

      for (const s of shifts) {
        // Band between the last low reading and the first high reading
        const x1 = x(s.firstHigh - 1);
        const x2 = x(s.firstHigh);
        ctx.fillStyle = 'rgba(245,158,11,0.16)';
        ctx.fillRect(x1, chartArea.top, x2 - x1, chartArea.height);
        ctx.fillStyle = 'rgba(180,83,9,0.7)';
        ctx.font = '9px system-ui, sans-serif';
        ctx.fillText('Eisprung', x1 + 3, chartArea.top + 11);

        if (s.coverFrom >= 0 && s.coverTo >= s.coverFrom) {
          const y = scales.y.getPixelForValue(s.coverline);
          ctx.strokeStyle = 'rgba(245,158,11,0.85)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(x(s.coverFrom), y);
          ctx.lineTo(x(s.coverTo), y);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      for (const idx of periodStartLines) {
        ctx.strokeStyle = 'rgba(124,58,237,0.45)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(x(idx), chartArea.top);
        ctx.lineTo(x(idx), chartArea.bottom);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.restore();
    },
  };

  const zeroLinePlugin = {
    id: 'zeroLine',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      const y0 = scales.y.getPixelForValue(0);
      if (y0 < chartArea.top || y0 > chartArea.bottom) return;
      ctx.save();
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(chartArea.left, y0);
      ctx.lineTo(chartArea.right, y0);
      ctx.stroke();
      ctx.restore();
    },
  };

  const ctx = document.getElementById('tempChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    plugins: [annotationsPlugin, zeroLinePlugin],
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: '#a78bfa',
        borderWidth: 1.5,
        pointBackgroundColor: pointColors,
        pointBorderColor: pointColors,
        pointRadius: 3,
        pointHoverRadius: 5,
        fill: {
          target: { value: 0 },
          above: 'rgba(59,130,246,0.10)',
          below: 'rgba(124,58,237,0.07)',
        },
        tension: 0.35,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#ffffff',
          borderColor: 'rgba(0,0,0,0.1)',
          borderWidth: 1,
          titleColor: '#57534e',
          bodyColor: '#1c1917',
          callbacks: {
            label: c => ` ${fmtTemp(c.raw)} Abweichung`,
          },
        },
      },
      scales: {
        x: {
          ticks: { color: '#475569', font: { size: 10 }, maxTicksLimit: 10, maxRotation: 0 },
          grid:   { display: false },
          border: { display: false },
        },
        y: {
          ticks: {
            color: '#475569',
            font: { size: 11 },
            callback: v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1).replace('.', ',') + '°',
          },
          grid:   { color: 'rgba(0,0,0,0.07)' },
          border: { display: false },
        },
      },
    },
  });
}

// ── Main ──────────────────────────────────────────────────────────────────────

async function init() {
  const app = document.getElementById('app');

  let raw;
  try {
    const resp = await fetch('data.json', { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    raw = await resp.json();
  } catch (err) {
    app.innerHTML = `
      <div class="error-box">
        <h1>Vivi's Zyklus Dashboard</h1>
        <div class="error-msg">
          <strong>data.json nicht gefunden.</strong><br><br>
          Führe zuerst das Fetch-Skript aus:<br>
          <code>OURA_TOKEN=&lt;token&gt; python fetch_oura.py</code>
        </div>
      </div>`;
    return;
  }

  const today       = todayStr();
  const temperature = (raw.temperature ?? []).filter(t => t.temperature_deviation != null);
  const tempMap     = new Map(temperature.map(t => [t.day, t.temperature_deviation]));
  const analysis    = analyzeCycles(raw, today);
  const { periodSet, avgLength, currentDay, nextPeriod, lastStart, currentPeriodDuration } = analysis;

  const cycleInfos = analysis.cycles.map(c => {
    const end   = c.length ? addDays(c.start, c.length - 1) : today;
    const shift = detectShift(tempMap, c.start, end);
    return { ...c, shift, luteal: shift && c.length ? c.length - shift.ovDay : null };
  });
  const current       = cycleInfos.find(c => c.start === lastStart && !c.length) ?? null;
  const currentShift  = current?.shift ?? null;
  const lastCompleted = [...cycleInfos].reverse().find(c => c.length && !c.isOutlier) ?? null;

  const model      = fertilityModel(cycleInfos, analysis);
  const tempStatus = currentTempStatus(tempMap, lastStart, today);
  const risk       = current && currentDay != null ? riskForDay(currentDay, model, currentShift) : null;
  const phases     = calculatePhases(currentDay, avgLength, model, currentShift, periodSet.has(today));
  const daysLeft   = nextPeriod ? daysBetween(today, nextPeriod) : null;

  // Calendar risk zones
  const redSet    = new Set();
  const orangeSet = new Set();

  // Past cycles: retrospective, around the observed (or estimated) ovulation day
  const markAroundOv = ovDate => {
    for (let i = -2; i <= 1; i++)  redSet.add(addDays(ovDate, i));
    for (let i = -5; i <= -3; i++) orangeSet.add(addDays(ovDate, i));
  };
  for (const c of cycleInfos) {
    if (!c.length) continue;
    if (c.shift) markAroundOv(c.shift.ovDate);
    else if (!c.isOutlier) markAroundOv(addDays(c.start, c.length - 14 - 1));
  }

  // Current and projected cycles: same model as the contraception card
  const markCycle = (start, shift, uptoDay) => {
    for (let cd = 1; cd <= uptoDay; cd++) {
      const r  = riskForDay(cd, model, shift);
      const ds = addDays(start, cd - 1);
      if (r === 'red') redSet.add(ds);
      else if (r === 'orange' || r === 'unconfirmed') orangeSet.add(ds);
    }
  };
  if (current) markCycle(lastStart, currentShift, Math.max(model.winEnd, currentDay));
  if (lastStart && avgLength) {
    const yearEnd = `${today.slice(0, 4)}-12-31`;
    let projStart = addDays(lastStart, avgLength);
    while (projStart <= yearEnd) {
      markCycle(projStart, null, model.winEnd);
      projStart = addDays(projStart, avgLength);
    }
  }

  const fetchedAt     = raw.meta?.fetched_at ?? '';
  const dataStale     = fetchedAt && daysBetween(fetchedAt, today) > 1;
  const latestTempDay = temperature.at(-1)?.day ?? null;
  const outlierCount  = analysis.cycles.filter(c => c.isOutlier).length;

  app.innerHTML = `
    <header>
      <h1>Vivi's Zyklus Dashboard</h1>
      ${fetchedAt ? `<span class="fetched-at">Stand: ${fmtDateFull(fetchedAt)}</span>` : ''}
    </header>

    <div class="grid">
      ${dataStale ? `<div class="stale-warning">⚠ Daten vom ${fmtDateFull(fetchedAt)}. Die tägliche Synchronisation hat eventuell noch nicht stattgefunden, einige Einträge könnten fehlen.</div>` : ''}

      <div class="stats-row">
        <div class="card stat-card stat-rose">
          <div class="stat-label">Zyklustag</div>
          <div class="stat-value">${currentDay ?? '–'}</div>
          <div class="stat-sub">seit ${fmtDate(lastStart)}</div>
        </div>
        <div class="card stat-card stat-lavender">
          <div class="stat-label">Ø Zykluslänge</div>
          <div class="stat-value">${avgLength ? `${avgLength}d` : '–'}</div>
          <div class="stat-sub">${model.nValid} Zyklen (${model.shortest ?? '?'} bis ${model.longest ?? '?'} Tage)${outlierCount ? `, ${outlierCount} Ausreißer exkl.` : ''}</div>
        </div>
        <div class="card stat-card stat-teal">
          <div class="stat-label">Nächste Periode (ca.)</div>
          <div class="stat-value">${daysLeft != null ? `${daysLeft}d` : '–'}</div>
          <div class="stat-sub">${nextPeriod ? `ca. ${fmtDate(nextPeriod)}` : 'nicht genug Daten'}</div>
        </div>
      </div>

      ${buildFertilityCard(risk, model, currentShift, lastStart, tempStatus, currentDay)}

      ${buildDailyAssessment({ currentDay, avgLength, phases, model, shift: currentShift, lastStart, tempStatus, nextPeriod, lastCompleted, latestTempDay, today })}

      <div class="card">
        <div class="section-title">Temperaturkurve: Abweichung vom Baseline</div>
        <div style="font-size:.75rem;color:var(--text-dim);margin-bottom:1rem;line-height:1.5">
          Lila Punkte = Periodentage · Lila gestrichelt = Periodenanfang · Gelbes Band = Eisprung · Gelbe Linie = Hilfslinie (3 über 6)
        </div>
        <div class="chart-wrapper" style="height:180px"><canvas id="tempChart"></canvas></div>
        <div class="temp-explainer">
          <div class="temp-explainer-row">
            <div class="temp-phase-dot" style="background:${PHASE_COLORS.menstrual}"></div>
            <span><strong>Menstruation und Follikelphase:</strong> Temperatur meist leicht unter dem Baseline (ca. −0,1 bis −0,3 °C).</span>
          </div>
          <div class="temp-explainer-row">
            <div class="temp-phase-dot" style="background:${PHASE_COLORS.fertile}"></div>
            <span><strong>Eisprung:</strong> Danach steigt die Temperatur um mindestens 0,2 °C. Bestätigt ist der Eisprung, wenn 3 Werte in Folge über der Hilfslinie liegen, also über den 6 Werten davor. Die Temperatur zeigt den Eisprung erst im Nachhinein.</span>
          </div>
          <div class="temp-explainer-row">
            <div class="temp-phase-dot" style="background:${PHASE_COLORS.luteal}"></div>
            <span><strong>Lutealphase:</strong> Progesteron hält die Temperatur erhöht (ca. +0,2 bis +0,5 °C), kurz vor der nächsten Periode fällt sie wieder ab.</span>
          </div>
        </div>
      </div>

      <div class="card">
        ${buildPhaseCard(phases, currentDay, currentPeriodDuration)}
      </div>

      <div class="card">
        <div class="section-title">Kalender ${today.slice(0, 4)}</div>
        ${buildCalendar(periodSet, redSet, orangeSet, today)}
      </div>

      <div class="card">
        <div class="section-title">Verlauf</div>
        <div class="cycle-list">${buildCycleList(cycleInfos, currentDay)}</div>
      </div>

      ${buildUncertaintyNotice(model.nValid)}
    </div>`;

  buildTempChart(temperature, periodSet, cycleInfos);
}

init();
</script>
</body>
</html>
