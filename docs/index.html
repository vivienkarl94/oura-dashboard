<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oura Cycle Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:           #f8f7f5;
      --surface:      #ffffff;
      --surface2:     #f0eeec;
      --border:       rgba(0,0,0,0.09);
      --rose:         #f43f5e;
      --rose-light:   #e11d48;
      --rose-dim:     rgba(244,63,94,0.1);
      --lavender:     #7c3aed;
      --lavender-dim: rgba(124,58,237,0.1);
      --teal:         #0d9488;
      --teal-dim:     rgba(13,148,136,0.1);
      --text:         #1c1917;
      --text-muted:   #57534e;
      --text-dim:     #a8a29e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.25rem 4rem;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(130deg, var(--rose-light) 0%, var(--lavender) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .fetched-at {
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .grid {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
    }

    .section-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 1.25rem;
    }

    /* ── Stat cards ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .stat-card {
      border-radius: 18px;
      padding: 1.4rem 1.5rem;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .stat-rose     { background: linear-gradient(135deg, var(--surface) 60%, rgba(244,63,94,0.15)); }
    .stat-lavender { background: linear-gradient(135deg, var(--surface) 60%, rgba(167,139,250,0.15)); }
    .stat-teal     { background: linear-gradient(135deg, var(--surface) 60%, rgba(45,212,191,0.15)); }

    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .stat-rose     .stat-value { color: var(--rose-light); }
    .stat-lavender .stat-value { color: var(--lavender); }
    .stat-teal     .stat-value { color: var(--teal); }

    .stat-sub {
      margin-top: 0.45rem;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    /* ── Assessment card ── */
    .assessment-card {
      border-radius: 18px;
      padding: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--rose);
    }

    .assessment-card.follicular { border-left-color: var(--lavender); }
    .assessment-card.fertile    { border-left-color: #f59e0b; }
    .assessment-card.luteal     { border-left-color: #60a5fa; }

    .assessment-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .assessment-phase-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 0.3rem;
    }

    .assessment-phase-name {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--rose-light);
    }

    .assessment-phase-name.follicular { color: var(--lavender); }
    .assessment-phase-name.fertile    { color: #92400e; }
    .assessment-phase-name.luteal     { color: #1d4ed8; }

    .assessment-date {
      font-size: 0.78rem;
      color: var(--text-dim);
      text-align: right;
    }

    .assessment-meta {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding: 0.9rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .assessment-meta-item { display: flex; flex-direction: column; gap: 3px; }

    .assessment-meta-lbl {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .assessment-meta-val {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
    }

    .assessment-body {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .assessment-body strong { color: var(--text); }

    .assessment-note {
      margin-top: 0.75rem;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      font-size: 0.79rem;
      line-height: 1.6;
    }

    .assessment-note.temp { background: rgba(124,58,237,0.07);  color: #5b21b6; border: 1px solid rgba(124,58,237,0.18); }
    .assessment-note.info { background: rgba(13,148,136,0.07);  color: #0f766e; border: 1px solid rgba(13,148,136,0.18); }
    .assessment-note.warn { background: rgba(245,158,11,0.09);  color: #b45309; border: 1px solid rgba(245,158,11,0.22); }

    /* ── Calendar ── */
    .cal-grid { display: flex; flex-direction: column; gap: 5px; }

    .cal-row { display: flex; align-items: center; gap: 8px; }

    .cal-label {
      font-size: 0.7rem;
      color: var(--text-dim);
      width: 46px;
      text-align: right;
      flex-shrink: 0;
      letter-spacing: 0.03em;
    }

    .cal-days { display: flex; gap: 2.5px; flex-wrap: nowrap; }

    .cal-day {
      width: 15px;
      height: 15px;
      border-radius: 3px;
      background: var(--surface2);
      flex-shrink: 0;
      cursor: default;
      transition: transform 0.1s ease;
    }

    .cal-day:hover          { transform: scale(1.4); z-index: 1; position: relative; }
    .cal-day.empty          { background: transparent; cursor: default; }
    .cal-day.future         { background: rgba(0,0,0,0.03); }
    .cal-day.period         { background: var(--rose); }
    .cal-day.risk-red       { background: #ef4444; }
    .cal-day.risk-orange    { background: #f97316; }
    .cal-day.risk-green     { background: #86efac; }
    .cal-day.today          { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px #57534e !important; }

    .legend {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .legend-dot { width: 11px; height: 11px; border-radius: 2px; }

    /* ── Two-column ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    /* ── Chart ── */
    .chart-wrapper { position: relative; height: 200px; }

    /* ── Cycle list ── */
    .cycle-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 232px;
      overflow-y: auto;
    }

    .cycle-list::-webkit-scrollbar { width: 4px; }
    .cycle-list::-webkit-scrollbar-track { background: transparent; }
    .cycle-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .cycle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.9rem;
      background: var(--surface2);
      border-radius: 10px;
      border-left: 2.5px solid var(--rose);
    }

    .cycle-item.is-outlier { border-left-color: #f59e0b; }

    .cycle-item-date { font-size: 0.83rem; font-weight: 600; }
    .cycle-item-sub  { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }

    .badge {
      font-size: 0.72rem;
      padding: 2px 9px;
      border-radius: 99px;
      background: var(--rose-dim);
      color: var(--rose-light);
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.active   { background: var(--teal-dim); color: var(--teal); }
    .badge.outlier  { background: rgba(245,158,11,0.12); color: #fbbf24; }

    /* ── States ── */
    .loading { max-width: 1100px; margin: 4rem auto; text-align: center; color: var(--text-dim); }

    .error-box { max-width: 1100px; margin: 2rem auto; }
    .error-box h1 { margin-bottom: 1.5rem; }

    .error-msg {
      background: rgba(244,63,94,0.08);
      border: 1px solid rgba(244,63,94,0.25);
      border-radius: 14px;
      padding: 1.5rem 2rem;
      color: var(--rose-light);
      line-height: 1.6;
    }

    .error-msg code {
      background: rgba(244,63,94,0.15);
      padding: 0.1em 0.45em;
      border-radius: 4px;
      font-size: 0.9em;
    }

    /* ── Phase bar ── */
    .phase-bar-wrap {
      position: relative;
      padding-bottom: 1.6rem;
      margin-bottom: 0.25rem;
    }

    .phase-bar { display: flex; height: 22px; gap: 3px; }

    .phase-seg {
      border-radius: 5px;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .phase-seg:hover { opacity: 0.75; cursor: default; }

    .phase-seg.uncertain {
      background-image: repeating-linear-gradient(
        135deg, transparent 0, transparent 5px, rgba(0,0,0,0.22) 5px, rgba(0,0,0,0.22) 10px
      ) !important;
    }

    .phase-pin {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .phase-pin-line  { width: 2px; height: 22px; background: var(--text); opacity: 0.85; border-radius: 1px; }
    .phase-pin-label { font-size: 0.67rem; color: var(--text-muted); margin-top: 4px; white-space: nowrap; }

    .phase-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 0.9rem;
    }

    .phase-legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--text-muted); }
    .phase-legend-dot  { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    .phase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.3rem 0.9rem;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .phase-badge.menstrual  { background: var(--rose-dim);            color: var(--rose-light); }
    .phase-badge.follicular { background: var(--lavender-dim);        color: var(--lavender); }
    .phase-badge.fertile    { background: rgba(245,158,11,0.15);      color: #92400e; }
    .phase-badge.luteal     { background: rgba(59,130,246,0.12);      color: #1d4ed8; }
    .phase-badge.unknown    { background: rgba(0,0,0,0.05);           color: var(--text-dim); }

    /* ── Uncertainty notice ── */
    .uncertainty-notice {
      background: rgba(245,158,11,0.07);
      border: 1px solid rgba(245,158,11,0.22);
      border-radius: 18px;
      padding: 1.4rem 1.5rem;
    }

    .un-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .un-body {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.65;
    }

    .un-body strong { color: #fbbf24; }

    .un-confidence {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .un-conf-label { font-size: 0.72rem; color: var(--text-dim); }
    .conf-dots     { display: flex; gap: 5px; }

    .conf-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1.5px solid rgba(245,158,11,0.35);
      background: transparent;
    }

    .conf-dot.filled { background: #f59e0b; border-color: #f59e0b; }

    /* ── Fertility card ── */
    .fertility-card {
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 1.25rem;
      border: 1.5px solid;
    }

    .fertility-green   { background: #f0fdf4; border-color: #bbf7d0; color: #14532d; }
    .fertility-orange  { background: #fffbeb; border-color: #fde68a; color: #78350f; }
    .fertility-red     { background: #fff1f2; border-color: #fecdd3; color: #881337; }
    .fertility-unknown { background: var(--surface); border-color: var(--border); color: var(--text-muted); }

    .fc-icon {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1;
      flex-shrink: 0;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fertility-green .fc-icon  { background: #dcfce7; }
    .fertility-orange .fc-icon { background: #fef3c7; }
    .fertility-red .fc-icon    { background: #ffe4e6; }
    .fertility-unknown .fc-icon { background: var(--surface2); }

    .fc-headline { font-size: 1rem; font-weight: 700; margin-bottom: 0.3rem; }
    .fc-detail   { font-size: 0.84rem; line-height: 1.55; margin-bottom: 0.3rem; opacity: 0.9; }
    .fc-prob     { font-size: 0.79rem; opacity: 0.75; }
    .fc-prob strong { font-weight: 700; opacity: 1; }
    .fc-uncertainty {
      margin-top: 0.6rem;
      font-size: 0.74rem;
      opacity: 0.65;
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      background: rgba(0,0,0,0.06);
    }

    .stale-warning {
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 10px;
      padding: 0.55rem 1rem;
      font-size: 0.78rem;
      color: #92400e;
      margin-bottom: 1rem;
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .stats-row { grid-template-columns: 1fr; }
      .two-col   { grid-template-columns: 1fr; }
      .cal-day   { width: 12px; height: 12px; }
      .cal-label { width: 36px; font-size: 0.65rem; }
      .assessment-meta { gap: 1rem; }
    }
  </style>
</head>
<body>

<div id="app">
  <div class="loading">Lade Daten…</div>
</div>

<script>
const MONTHS_DE = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

// ── Utilities ─────────────────────────────────────────────────────────────────

function addDays(ds, n) {
  const d = new Date(ds);
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86_400_000);
}

function daysUntil(ds) {
  if (!ds) return null;
  return Math.ceil((new Date(ds) - new Date()) / 86_400_000);
}

function fmtDate(ds) {
  if (!ds) return '—';
  const d = new Date(ds);
  return `${d.getDate()}. ${MONTHS_DE[d.getMonth()]}`;
}

function fmtDateFull(ds) {
  if (!ds) return '—';
  const d = new Date(ds);
  return `${d.getDate()}. ${MONTHS_DE[d.getMonth()]} ${d.getFullYear()}`;
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

// ── Period merging ────────────────────────────────────────────────────────────
// Oura logs each period day as a separate enhanced_tag entry.
// Merge entries that are ≤1 day apart into a single period span.

function mergePeriods(rawPeriods) {
  const sorted = [...rawPeriods].sort((a, b) => a.start_day.localeCompare(b.start_day));
  const merged = [];
  for (const p of sorted) {
    const pEnd = p.end_day ?? p.start_day;
    const last = merged.at(-1);
    if (last && daysBetween(last.end, p.start_day) <= 1) {
      if (pEnd > last.end) last.end = pEnd;
    } else {
      merged.push({ start: p.start_day, end: pEnd });
    }
  }
  return merged;
}

// ── Cycle analysis ────────────────────────────────────────────────────────────

function analyzeCycles(raw) {
  const periods = mergePeriods(raw.periods ?? []);

  const periodSet = new Set();
  for (const p of periods) {
    let cur = p.start;
    while (cur <= p.end) {
      periodSet.add(cur);
      cur = addDays(cur, 1);
    }
  }

  const today = todayStr();

  const cycles = periods.map((p, i) => {
    const next     = periods[i + 1] ?? null;
    const length   = next ? daysBetween(p.start, next.start) : null;
    const duration = daysBetween(p.start, p.end) + 1;
    // Cycles >45 days flagged as outliers (fasting, post-pill suppression, etc.)
    const isOutlier = length != null && length > 45;
    return { start: p.start, end: p.end, length, duration, isOutlier };
  });

  const startDates = periods.map(p => p.start);

  const validLengths = cycles
    .filter(c => c.length != null && !c.isOutlier && c.length >= 18 && c.length <= 45)
    .map(c => c.length);

  const avgLength = validLengths.length
    ? Math.round(validLengths.reduce((a, b) => a + b, 0) / validLengths.length)
    : null;

  const lastStart   = startDates.filter(d => d <= today).at(-1) ?? null;
  const currentDay  = lastStart ? daysBetween(lastStart, today) + 1 : null;

  let nextPeriod = null;
  if (lastStart && avgLength) {
    const est = addDays(lastStart, avgLength);
    if (est > today) nextPeriod = est;
  }

  // Count actual tracked period days in current cycle directly from periodSet
  const currentPeriodDuration = lastStart
    ? ([...periodSet].filter(d => d >= lastStart && d <= today).length || null)
    : null;

  return { periodSet, startDates, cycles, avgLength, currentDay, nextPeriod, lastStart, currentPeriodDuration };
}

// ── Ovulation detection from temperature ─────────────────────────────────────
// Returns the cycle-day number of the observed temperature peak in the most
// recent non-outlier completed cycle. The day before the peak is typically
// closest to actual ovulation, but we return the peak day for display.

function detectObservedOvulation(temperatureData, cycles) {
  const refCycle = [...cycles].reverse().find(c => c.length && !c.isOutlier);
  if (!refCycle) return null;

  // Lutealphase is biologically fixed at 10–16 days → ovulation must be
  // detected at least 10 days before cycle end. Readings > 0.7 °C above
  // baseline are fever/artifact territory, not an ovulation shift.
  const maxOvDay = refCycle.length - 10;
  if (maxOvDay < 8) return null;

  let maxDev = 0.2;
  let ovulationDay = null;

  for (const t of temperatureData) {
    if (t.temperature_deviation == null) continue;
    const dayNum = daysBetween(refCycle.start, t.day) + 1;
    if (dayNum < 1 || dayNum > maxOvDay) continue;
    if (Math.abs(t.temperature_deviation) > 0.7) continue; // fever filter
    if (t.temperature_deviation > maxDev) {
      maxDev = t.temperature_deviation;
      ovulationDay = dayNum;
    }
  }
  return ovulationDay;
}

// ── Phase calculation ─────────────────────────────────────────────────────────

const PHASE_LABELS = {
  menstrual:  'Menstruation',
  follicular: 'Follikelphase',
  fertile:    'Fruchtbare Tage',
  luteal:     'Lutealphase',
};

const PHASE_COLORS = {
  menstrual:  '#f43f5e',
  follicular: '#8b5cf6',
  fertile:    '#f59e0b',
  luteal:     '#3b82f6',
};

function calculatePhases(currentDay, avgLength, completedCycles, observedOvulationDay, todayInPeriod) {
  const len       = avgLength ?? 28;
  const periodLen = 5;

  // Prefer observed ovulation day from temperature data over the textbook estimate
  const ovulationDay = observedOvulationDay ?? Math.max(periodLen + 3, len - 14);

  // Widen fertile window the fewer cycles we have (post-pill uncertainty)
  const extra      = completedCycles < 2 ? 7 : completedCycles < 5 ? 4 : 2;
  const fertileStart = Math.max(periodLen + 2, ovulationDay - extra);
  const fertileEnd   = Math.min(len - 1, ovulationDay + 2);

  let currentPhase = 'unknown';
  if (currentDay != null) {
    // Only show menstrual if Oura actually logged a period for today
    if (todayInPeriod)              currentPhase = 'menstrual';
    else if (currentDay < fertileStart) currentPhase = 'follicular';
    else if (currentDay <= fertileEnd)  currentPhase = 'fertile';
    else                                currentPhase = 'luteal';
  }

  const uncertainty = completedCycles < 2 ? 'high' : completedCycles < 5 ? 'medium' : 'low';

  return { len, periodLen, ovulationDay, fertileStart, fertileEnd, currentPhase, uncertainty };
}

// ── Daily gynecological assessment card ───────────────────────────────────────

function buildDailyAssessment(currentDay, avgLength, phases, observedOvulationDay, lastStart, temperatureData) {
  const { currentPhase, ovulationDay, len } = phases;

  const phaseNames = {
    menstrual:  'Menstruation',
    follicular: 'Follikelphase',
    fertile:    'Fruchtbares Fenster',
    luteal:     'Lutealphase',
    unknown:    '—',
  };

  const phaseDescriptions = {
    menstrual:
      'Du bist in der <strong>Menstruationsphase</strong>. Östrogen und Progesteron befinden sich auf ihrem zyklischen Tiefpunkt — die Gebärmutterschleimhaut wird abgestoßen. Typisch sind in dieser Phase Krämpfe, etwas weniger Energie und eine kühlere Körpertemperatur.',
    follicular:
      'Du befindest dich in der <strong>Follikelphase</strong>. FSH regt die Follikelreifung an, Östrogen steigt langsam an. Viele erleben in dieser Phase mehr Energie, bessere Konzentration und eine positive Grundstimmung.',
    fertile:
      'Du befindest dich voraussichtlich im <strong>fruchtbaren Fenster</strong>. Der Östrogen-Peak löst den LH-Anstieg aus — der Eisprung steht bevor oder hat gerade stattgefunden. Achte auf den Temperaturanstieg im Oura-Ring als Bestätigung.',
    luteal:
      'Du bist in der <strong>Lutealphase</strong>. Der Gelbkörper produziert Progesteron, die Körpertemperatur bleibt erhöht. Gegen Ende dieser Phase sinkt Progesteron ab, was die Periode einleitet.',
    unknown:
      'Phase noch nicht bestimmbar — mehr Trackingdaten nötig.',
  };

  const today = todayStr();

  // Expected ovulation date in current cycle
  const expectedOvDate = (lastStart && ovulationDay)
    ? addDays(lastStart, ovulationDay - 1)
    : null;

  // Expected next period
  const nextPeriodDate = (lastStart && avgLength)
    ? addDays(lastStart, avgLength)
    : null;

  // Luteal phase length from last cycle
  const luteaLen = (observedOvulationDay && avgLength)
    ? avgLength - observedOvulationDay
    : null;

  // Most recent temperature in current cycle
  const recentTemp = temperatureData
    .filter(t => lastStart && t.day >= lastStart)
    .at(-1) ?? null;

  // Build notes
  const notes = [];

  if (recentTemp) {
    const dev  = recentTemp.temperature_deviation;
    const sign = dev >= 0 ? '+' : '';
    const interp = dev <= -0.1
      ? 'niedrig — konsistent mit Menstruation / Follikelphase'
      : dev >= 0.4
      ? 'erhöht — mögliches Ovulationssignal oder Lutealphase'
      : 'im Normalbereich';
    notes.push({
      type: 'temp',
      text: `Letzte Temperaturmessung (${fmtDate(recentTemp.day)}): <strong>${sign}${dev.toFixed(2)} °C</strong> — ${interp}.`,
    });
  }

  if (expectedOvDate) {
    const daysToOv = daysBetween(today, expectedOvDate);
    if (daysToOv > 3) {
      notes.push({
        type: 'info',
        text: `Eisprung erwartet: ca. <strong>${fmtDate(expectedOvDate)}</strong> (Tag ${ovulationDay}, in ~${daysToOv} Tagen) — basiert auf dem beobachteten Temperatur-Shift im letzten Zyklus.`,
      });
    } else if (daysToOv >= -2) {
      notes.push({
        type: 'warn',
        text: `Fruchtbares Fenster voraussichtlich jetzt. Achte auf den Temperaturanstieg im Ring zur Bestätigung.`,
      });
    }
  }

  if (luteaLen !== null && luteaLen < 10) {
    notes.push({
      type: 'warn',
      text: `Hinweis aus letztem Zyklus: Lutealphase war mit ~${luteaLen} Tagen kurz (Norm: 12–14 Tage). Nach Pille und nach Fastenperioden ist das nicht ungewöhnlich und sollte sich mit weiteren Zyklen normalisieren.`,
    });
  }

  // Meta row items
  const metaItems = [
    { lbl: 'Zyklustag',        val: currentDay != null ? `${currentDay} / ${len}` : '—' },
    { lbl: 'Periode seit',     val: fmtDate(lastStart) },
    { lbl: 'Nächste Periode',  val: nextPeriodDate ? `ca. ${fmtDate(nextPeriodDate)}` : '—' },
    { lbl: 'Eisprung erwartet', val: expectedOvDate ? `ca. ${fmtDate(expectedOvDate)}` : '—' },
  ];

  const metaHtml = metaItems.map(m => `
    <div class="assessment-meta-item">
      <div class="assessment-meta-lbl">${m.lbl}</div>
      <div class="assessment-meta-val">${m.val}</div>
    </div>`).join('');

  const notesHtml = notes.map(n =>
    `<div class="assessment-note ${n.type}">${n.text}</div>`
  ).join('');

  const dateLabel = new Date().toLocaleDateString('de-DE', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });

  return `
    <div class="assessment-card ${currentPhase}">
      <div class="assessment-top">
        <div>
          <div class="assessment-phase-label">Gynäkologische Tagesauswertung</div>
          <div class="assessment-phase-name ${currentPhase}">${phaseNames[currentPhase] ?? '—'}</div>
        </div>
        <div class="assessment-date">${dateLabel}</div>
      </div>
      <div class="assessment-meta">${metaHtml}</div>
      <div class="assessment-body">
        ${phaseDescriptions[currentPhase] ?? ''}
        ${notesHtml}
      </div>
    </div>`;
}

// ── Fertility / contraception card ───────────────────────────────────────────
// 3-level risk based on Wilcox 1995 (NEJM) + Dunson 2002 (Hum Reprod):
// RED   = OV−2 to OV+1 → 15–33% pregnancy probability
// ORANGE = OV−5 to OV−3 → 5–17%  (sperm survival zone)
// GREEN  = outside fertile window → <3%
// Post-pill uncertainty widens zones by 1–2 days.

function buildFertilityCard(ovDate, todayS, completedCycles) {
  if (!ovDate) {
    return `<div class="fertility-card fertility-unknown">
      <div class="fc-icon">?</div>
      <div>
        <div class="fc-headline">Verhütungsempfehlung</div>
        <div class="fc-detail">Noch nicht genug Daten für eine Eisprung-Vorhersage.</div>
      </div>
    </div>`;
  }

  const daysToOv = daysBetween(todayS, ovDate);

  // Uncertainty buffer expands risk windows for post-pill cycles
  const buf = completedCycles < 2 ? 2 : completedCycles < 5 ? 1 : 0;

  const orangeStart = 5 + buf;  // days before OV → ORANGE begins
  const redStart    = 2 + buf;  // days before OV → RED begins
  const redEnd      = 1 + buf;  // days after  OV → RED ends

  let level, icon, headline, prob, detail;

  if (daysToOv > orangeStart) {
    level = 'green'; icon = '✓';
    headline = 'Kein erhöhtes Risiko heute';
    prob = '< 3%';
    detail = daysToOv > 0
      ? `Fruchtbares Fenster beginnt in ca. ${daysToOv - orangeStart} Tagen (voraussichtlicher Eisprung: ${fmtDate(ovDate)}).`
      : 'Außerhalb des fruchtbaren Fensters.';
  } else if (daysToOv > redStart) {
    level = 'orange'; icon = '!';
    headline = 'Erhöhtes Risiko — Verhütung empfohlen';
    prob = daysToOv >= 5 ? '~ 5–8%' : daysToOv === 4 ? '~10–12%' : '~14–17%';
    detail = `Ca. ${daysToOv} Tage vor dem Eisprung (${fmtDate(ovDate)}). Spermien überleben bis zu 5 Tage — reales Schwangerschaftsrisiko.`;
  } else if (daysToOv >= -redEnd) {
    level = 'red'; icon = '⚠';
    headline = 'Hohes Risiko — unbedingt verhüten';
    if (daysToOv > 0) {
      prob = daysToOv <= 2 ? '~25–33%' : '~15–25%';
      detail = `${daysToOv} Tag${daysToOv !== 1 ? 'e' : ''} vor dem Eisprung (${fmtDate(ovDate)}) — höchste Fruchtbarkeit des Zyklus.`;
    } else if (daysToOv === 0) {
      prob = '~25–33%';
      detail = `Heute ist der voraussichtliche Eisprung (${fmtDate(ovDate)}) — Maximum der Fruchtbarkeit.`;
    } else {
      prob = '~1–5%';
      detail = `${Math.abs(daysToOv)} Tag${Math.abs(daysToOv) !== 1 ? 'e' : ''} nach dem Eisprung — Eizelle degeneriert innerhalb 24 h, geringes Restrisiko.`;
    }
  } else {
    level = 'green'; icon = '✓';
    headline = 'Kein erhöhtes Risiko heute';
    prob = '< 1%';
    detail = `Eisprung überschritten (${fmtDate(ovDate)}). Lutealphase — sehr geringes Schwangerschaftsrisiko.`;
  }

  const bufNote = buf > 0
    ? `<div class="fc-uncertainty">Sicherheitspuffer ±${buf} Tag${buf > 1 ? 'e' : ''} wegen post-Pille Unsicherheit (${completedCycles} abgeschlossene Zyklen). Basis: Wilcox 1995 / Dunson 2002.</div>`
    : '';

  return `<div class="fertility-card fertility-${level}">
    <div class="fc-icon">${icon}</div>
    <div>
      <div class="fc-headline">${headline}</div>
      <div class="fc-detail">${detail}</div>
      <div class="fc-prob">Schwangerschaftswahrscheinlichkeit heute: <strong>${prob}</strong></div>
      ${bufNote}
    </div>
  </div>`;
}

// ── Phase bar card ────────────────────────────────────────────────────────────

function buildPhaseCard(phases, currentDay, actualPeriodLen) {
  const { len, periodLen, fertileStart, fertileEnd, currentPhase, uncertainty } = phases;
  const barPeriodLen = actualPeriodLen ?? periodLen;

  const segs = [
    { key: 'menstrual',  start: 1,                end: barPeriodLen        },
    { key: 'follicular', start: barPeriodLen + 1,  end: fertileStart - 1    },
    { key: 'fertile',    start: fertileStart,  end: fertileEnd      },
    { key: 'luteal',     start: fertileEnd + 1, end: len            },
  ].filter(s => s.start <= s.end);

  const pct = (s, e) => ((e - s + 1) / len * 100).toFixed(2) + '%';

  const segsHtml = segs.map(s => {
    const isUncertain = s.key === 'fertile' && uncertainty !== 'low';
    return `<div class="phase-seg${isUncertain ? ' uncertain' : ''}"
      style="width:${pct(s.start, s.end)};background:${PHASE_COLORS[s.key]}"
      title="${PHASE_LABELS[s.key]}: Tag ${s.start}–${s.end}"></div>`;
  }).join('');

  const pinHtml = currentDay != null
    ? `<div class="phase-pin" style="left:${((Math.min(currentDay, len) - 0.5) / len * 100).toFixed(2)}%">
        <div class="phase-pin-line"></div>
        <div class="phase-pin-label">Tag ${currentDay}</div>
      </div>`
    : '';

  const legendHtml = segs.map(s => {
    const isUncertain = s.key === 'fertile' && uncertainty !== 'low';
    return `<div class="phase-legend-item">
      <div class="phase-legend-dot" style="background:${PHASE_COLORS[s.key]};opacity:${isUncertain ? 0.6 : 1}"></div>
      ${PHASE_LABELS[s.key]}${isUncertain ? ' <span style="color:var(--text-dim)">(±)</span>' : ''}
    </div>`;
  }).join('');

  return `
    <div class="phase-header">
      <div class="section-title" style="margin-bottom:0">Zyklusphase</div>
      <div class="phase-badge ${currentPhase}">${PHASE_LABELS[currentPhase] ?? '—'}</div>
    </div>
    <div class="phase-bar-wrap">
      <div class="phase-bar">${segsHtml}</div>
      ${pinHtml}
    </div>
    <div class="phase-legend">${legendHtml}</div>`;
}

// ── Uncertainty notice ────────────────────────────────────────────────────────

function buildUncertaintyNotice(completedCycles) {
  const maxDots  = 6;
  const filled   = Math.min(completedCycles, maxDots);
  const dotsHtml = Array.from({ length: maxDots }, (_, i) =>
    `<div class="conf-dot${i < filled ? ' filled' : ''}"></div>`
  ).join('');

  const statusText = filled === 0
    ? 'Noch kein abgeschlossener Zyklus getrackt.'
    : filled < 3
    ? `${filled} ${filled === 1 ? 'Zyklus' : 'Zyklen'} getrackt — wird mit der Zeit genauer.`
    : `${filled} Zyklen getrackt — Vorhersage wird zuverlässiger.`;

  return `<div class="uncertainty-notice">
    <div class="un-header"><span>⚠</span> Fruchtbarkeitsvorhersage eingeschränkt</div>
    <div class="un-body">
      Nach dem Absetzen der Pille stellt sich der Zyklus neu ein — das kann mehrere Monate
      dauern. Die angezeigten fruchtbaren Tage sind daher nur eine grobe Schätzung und
      <strong>kein verlässlicher Verhütungsschutz</strong>. Erst mit mehreren getrackten
      Zyklen wird die Vorhersage präziser.
    </div>
    <div class="un-confidence">
      <span class="un-conf-label">Konfidenz</span>
      <div class="conf-dots">${dotsHtml}</div>
      <span class="un-conf-label">${statusText}</span>
    </div>
  </div>`;
}

// ── Calendar ──────────────────────────────────────────────────────────────────

function buildCalendar(periodSet, startDates, redSet, orangeSet) {
  const today    = new Date();
  const todayS   = today.toISOString().slice(0, 10);

  const months = [];
  for (let m = 5; m >= 0; m--) {
    const d = new Date(today.getFullYear(), today.getMonth() - m, 1);
    months.push({ year: d.getFullYear(), month: d.getMonth() });
  }

  let html = '<div class="cal-grid">';

  for (const { year, month } of months) {
    const label       = `${MONTHS_DE[month]} ${year !== today.getFullYear() ? year : ''}`.trim();
    const firstDay    = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const offset      = (firstDay.getDay() + 6) % 7;

    html += `<div class="cal-row"><div class="cal-label">${label}</div><div class="cal-days">`;
    for (let i = 0; i < offset; i++) html += `<div class="cal-day empty"></div>`;

    for (let d = 1; d <= daysInMonth; d++) {
      const ds       = `${year}-${String(month + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday  = ds === todayS;
      const isPeriod = periodSet.has(ds);
      const isFuture = ds > todayS;
      const isRed    = isFuture && redSet?.has(ds);
      const isOrange = isFuture && !isRed && orangeSet?.has(ds);
      const isGreen  = isFuture && !isRed && !isOrange;

      let cls = 'cal-day';
      if (isPeriod)       cls += ' period';
      else if (isRed)     cls += ' risk-red';
      else if (isOrange)  cls += ' risk-orange';
      else if (isGreen)   cls += ' risk-green';

      if (isToday) cls += ' today';

      let title = ds;
      if (isPeriod) title = `Periode: ${ds}`;
      if (isRed)    title = `Hohes Risiko: ${ds}`;
      if (isOrange) title = `Erhöhtes Risiko: ${ds}`;
      if (isGreen)  title = `Kein erhöhtes Risiko: ${ds}`;
      if (isToday)  title = `Heute: ${ds}`;

      html += `<div class="${cls}" title="${title}"></div>`;
    }

    html += `</div></div>`;
  }

  html += `</div>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--rose)"></div>
      Periode
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#ef4444"></div>
      Hohes Risiko (OV−2 bis OV+1)
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#f97316"></div>
      Erhöhtes Risiko (OV−5 bis OV−3)
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#86efac"></div>
      Kein erhöhtes Risiko
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--surface2);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px #57534e"></div>
      Heute
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--surface2)"></div>
      Kein Eintrag
    </div>
  </div>`;

  return html;
}

// ── Cycle list ────────────────────────────────────────────────────────────────

function buildCycleList(cycles) {
  if (!cycles.length)
    return '<p style="color:var(--text-dim);font-size:.83rem">Keine Zyklen gefunden.</p>';

  return [...cycles].reverse().slice(0, 10).map(c => {
    const isActive  = !c.length;
    const isOutlier = c.isOutlier;

    let badgeClass = 'badge';
    let badgeText  = '';
    let subText    = '';

    if (isActive) {
      badgeClass += ' active';
      badgeText   = 'aktiv';
      subText     = 'Aktueller Zyklus';
    } else if (isOutlier) {
      badgeClass += ' outlier';
      badgeText   = '⚠ Ausreißer';
      subText     = `${c.length} Tage — nicht in Ø (Fasten / post-Pille)`;
    } else {
      badgeText = `${c.length}d`;
      subText   = `Länge: ${c.length} Tage`;
    }

    return `
      <div class="cycle-item${isOutlier ? ' is-outlier' : ''}">
        <div>
          <div class="cycle-item-date">${fmtDateFull(c.start)}</div>
          <div class="cycle-item-sub">${subText}</div>
        </div>
        <div class="${badgeClass}">${badgeText}</div>
      </div>`;
  }).join('');
}

// ── Temperature chart ─────────────────────────────────────────────────────────

function buildTempChart(temperatureData, periodSet, cycles, observedOvulationDay) {
  if (!temperatureData?.length) {
    document.getElementById('tempChart').parentElement.innerHTML =
      `<p style="color:var(--text-dim);font-size:.83rem;text-align:center;padding-top:2.5rem;line-height:1.6">
        Noch keine Temperaturdaten vorhanden.<br>
        <span style="font-size:.75rem">Trage den Ring jede Nacht — nach einigen Wochen erscheint hier die Kurve.</span>
      </p>`;
    return;
  }

  const slice  = temperatureData.slice(-90);
  const labels = slice.map(d => {
    const dt = new Date(d.day);
    return `${dt.getDate()}. ${MONTHS_DE[dt.getMonth()]}`;
  });
  const values = slice.map(d => d.temperature_deviation);

  const pointColors = slice.map(d =>
    periodSet.has(d.day) ? '#f43f5e' : '#a78bfa'
  );

  // Find ovulation band: day before peak through peak day of observed ovulation
  let ovBandStart = -1, ovBandEnd = -1;
  const refCycle = [...cycles].reverse().find(c => c.length && !c.isOutlier);
  if (refCycle && observedOvulationDay) {
    const peakDate  = addDays(refCycle.start, observedOvulationDay - 1);
    const bandStart = addDays(refCycle.start, observedOvulationDay - 2);
    ovBandStart = slice.findIndex(d => d.day >= bandStart);
    ovBandEnd   = slice.findIndex(d => d.day > peakDate) - 1;
    if (ovBandEnd < 0) ovBandEnd = slice.length - 1;
  }

  // Period start markers (vertical dashed lines)
  const periodStartLines = [];
  for (let i = 0; i < slice.length; i++) {
    const isPeriodFirstDay = periodSet.has(slice[i].day) &&
      (i === 0 || !periodSet.has(slice[i - 1].day));
    if (isPeriodFirstDay) periodStartLines.push(i);
  }

  const annotationsPlugin = {
    id: 'annotations',
    beforeDatasetsDraw(chart) {
      const { ctx, chartArea, data } = chart;
      const n = data.labels.length;
      if (!n || !chartArea) return;

      const bw = chartArea.width / n;
      ctx.save();

      // Ovulation band
      if (ovBandStart >= 0 && ovBandEnd >= ovBandStart) {
        const x1 = chartArea.left + ovBandStart * bw;
        const x2 = chartArea.left + (ovBandEnd + 1) * bw;
        ctx.fillStyle = 'rgba(245,158,11,0.12)';
        ctx.fillRect(x1, chartArea.top, x2 - x1, chartArea.height);
        // Label
        ctx.fillStyle = 'rgba(245,158,11,0.55)';
        ctx.font = '9px system-ui, sans-serif';
        ctx.fillText('Eisprung', x1 + 3, chartArea.top + 11);
      }

      // Period start lines
      for (const idx of periodStartLines) {
        const x = chartArea.left + (idx + 0.5) * bw;
        ctx.strokeStyle = 'rgba(244,63,94,0.45)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(x, chartArea.top);
        ctx.lineTo(x, chartArea.bottom);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.restore();
    },
  };

  const zeroLinePlugin = {
    id: 'zeroLine',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      const y0 = scales.y.getPixelForValue(0);
      if (y0 < chartArea.top || y0 > chartArea.bottom) return;
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(chartArea.left, y0);
      ctx.lineTo(chartArea.right, y0);
      ctx.stroke();
      ctx.restore();
    },
  };

  const ctx = document.getElementById('tempChart').getContext('2d');

  new Chart(ctx, {
    type: 'line',
    plugins: [annotationsPlugin, zeroLinePlugin],
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: '#a78bfa',
        borderWidth: 1.5,
        pointBackgroundColor: pointColors,
        pointBorderColor: pointColors,
        pointRadius: 3,
        pointHoverRadius: 5,
        fill: {
          target: { value: 0 },
          above: 'rgba(167,139,250,0.12)',
          below: 'rgba(244,63,94,0.08)',
        },
        tension: 0.35,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#ffffff',
          borderColor: 'rgba(0,0,0,0.1)',
          borderWidth: 1,
          titleColor: '#57534e',
          bodyColor: '#1c1917',
          callbacks: {
            label: ctx => {
              const v   = ctx.raw;
              const sign = v >= 0 ? '+' : '';
              return ` ${sign}${v.toFixed(2)} °C Abweichung`;
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { color: '#475569', font: { size: 10 }, maxTicksLimit: 10, maxRotation: 0 },
          grid:   { display: false },
          border: { display: false },
        },
        y: {
          ticks: {
            color: '#475569',
            font: { size: 11 },
            callback: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '°',
          },
          grid:   { color: 'rgba(0,0,0,0.07)' },
          border: { display: false },
        },
      },
    },
  });
}

// ── Cycle length chart ────────────────────────────────────────────────────────

function buildChart(cycles, avgLength) {
  // Exclude outliers from the bar chart
  const valid = cycles
    .filter(c => c.length != null && !c.isOutlier && c.length >= 18 && c.length <= 45)
    .slice(-14);

  if (!valid.length) {
    document.getElementById('cycleChart').parentElement.innerHTML =
      '<p style="color:var(--text-dim);font-size:.83rem;text-align:center;padding-top:3rem">Nicht genug Daten.</p>';
    return;
  }

  const ctx = document.getElementById('cycleChart').getContext('2d');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: valid.map(c => fmtDate(c.start)),
      datasets: [{
        data: valid.map(c => c.length),
        backgroundColor: 'rgba(244,63,94,0.45)',
        borderColor: '#f43f5e',
        borderWidth: 1.5,
        borderRadius: 5,
        borderSkipped: false,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#ffffff',
          borderColor: 'rgba(0,0,0,0.1)',
          borderWidth: 1,
          titleColor: '#57534e',
          bodyColor: '#1c1917',
          callbacks: { label: ctx => ` ${ctx.raw} Tage` },
        },
      },
      scales: {
        x: {
          ticks: { color: '#475569', font: { size: 11 } },
          grid:   { display: false },
          border: { display: false },
        },
        y: {
          ticks: { color: '#475569', font: { size: 11 }, stepSize: 5 },
          grid:   { color: 'rgba(0,0,0,0.07)' },
          border: { display: false },
          suggestedMin: avgLength ? avgLength - 8 : 20,
          suggestedMax: avgLength ? avgLength + 8 : 35,
        },
      },
    },
  });
}

// ── Main ──────────────────────────────────────────────────────────────────────

async function init() {
  const app = document.getElementById('app');

  let raw;
  try {
    const resp = await fetch('data.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    raw = await resp.json();
  } catch (err) {
    app.innerHTML = `
      <div class="error-box">
        <h1>Oura Cycle Dashboard</h1>
        <div class="error-msg">
          <strong>data.json nicht gefunden.</strong><br><br>
          Führe zuerst den Fetch-Skript aus:<br>
          <code>OURA_TOKEN=&lt;token&gt; python fetch_oura.py</code>
        </div>
      </div>`;
    return;
  }

  const { periodSet, startDates, cycles, avgLength, currentDay, nextPeriod, lastStart, currentPeriodDuration } =
    analyzeCycles(raw);

  const observedOvulationDay = detectObservedOvulation(raw.temperature ?? [], cycles);
  const completedCycles = cycles.filter(c => c.length != null).length;
  const phases   = calculatePhases(currentDay, avgLength, completedCycles, observedOvulationDay, periodSet.has(todayStr()));
  const daysLeft = daysUntil(nextPeriod);

  // Ovulation date + risk zone sets for calendar and fertility card
  const ovDate = (lastStart && phases.ovulationDay)
    ? addDays(lastStart, phases.ovulationDay - 1)
    : null;
  const buf = completedCycles < 2 ? 2 : completedCycles < 5 ? 1 : 0;
  const redSet    = new Set();
  const orangeSet = new Set();
  if (ovDate) {
    for (let i = -(2 + buf); i <= (1 + buf); i++) redSet.add(addDays(ovDate, i));
    for (let i = -(5 + buf); i <= -(3 + buf); i++) orangeSet.add(addDays(ovDate, i));
  }
  const fetchedAt = raw.meta?.fetched_at ?? '';

  const dataStale = fetchedAt && daysBetween(fetchedAt, todayStr()) > 1;

  app.innerHTML = `
    <header>
      <h1>Oura Cycle Dashboard</h1>
      ${fetchedAt ? `<span class="fetched-at">Stand: ${fetchedAt}</span>` : ''}
    </header>

    <div class="grid">

      ${dataStale ? `<div class="stale-warning">⚠ Daten vom ${fetchedAt} — die tägliche Synchronisation hat eventuell noch nicht stattgefunden. Einige Einträge könnten fehlen.</div>` : ''}

      <div class="stats-row">
        <div class="card stat-card stat-rose">
          <div class="stat-label">Zyklustag</div>
          <div class="stat-value">${currentDay ?? '—'}</div>
          <div class="stat-sub">seit ${fmtDate(lastStart)}</div>
        </div>
        <div class="card stat-card stat-lavender">
          <div class="stat-label">Ø Zykluslänge</div>
          <div class="stat-value">${avgLength ? `${avgLength}d` : '—'}</div>
          <div class="stat-sub">${completedCycles} Zyklen, ${cycles.filter(c=>c.isOutlier).length} Ausreißer exkl.</div>
        </div>
        <div class="card stat-card stat-teal">
          <div class="stat-label">Nächste Periode (ca.)</div>
          <div class="stat-value">${daysLeft != null ? `${daysLeft}d` : '—'}</div>
          <div class="stat-sub">${nextPeriod ? `ca. ${fmtDate(nextPeriod)}` : 'nicht genug Daten'}</div>
        </div>
      </div>

      ${buildFertilityCard(ovDate, todayStr(), completedCycles)}

      ${buildDailyAssessment(currentDay, avgLength, phases, observedOvulationDay, lastStart, raw.temperature ?? [])}

      <div class="card">
        ${buildPhaseCard(phases, currentDay, currentPeriodDuration)}
      </div>

      ${buildUncertaintyNotice(completedCycles)}

      <div class="card">
        <div class="section-title">Temperaturkurve — Abweichung vom Baseline</div>
        <div style="font-size:.75rem;color:var(--text-dim);margin-bottom:1rem;line-height:1.5">
          Rote Punkte = Periodentage · Gelbes Band = beobachteter Eisprung · Gestrichelt = Periodenanfang
        </div>
        <div class="chart-wrapper" style="height:180px"><canvas id="tempChart"></canvas></div>
      </div>

      <div class="card">
        <div class="section-title">Kalender — letzte 6 Monate</div>
        ${buildCalendar(periodSet, startDates, redSet, orangeSet)}
      </div>

      <div class="two-col">
        <div class="card">
          <div class="section-title">Zykluslängen (ohne Ausreißer)</div>
          <div class="chart-wrapper"><canvas id="cycleChart"></canvas></div>
        </div>
        <div class="card">
          <div class="section-title">Verlauf</div>
          <div class="cycle-list">${buildCycleList(cycles)}</div>
        </div>
      </div>

    </div>`;

  buildTempChart(raw.temperature ?? [], periodSet, cycles, observedOvulationDay);
  buildChart(cycles, avgLength);
}

init();
</script>
</body>
</html>
